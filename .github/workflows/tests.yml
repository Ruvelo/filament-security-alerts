name: tests

on:
  push:
    branches: [main]
  pull_request:

# ruvelo/laravel-security-alerts and its core, ruvelo/security-advisories, aren't
# on Packagist yet, so every job installs them from GitHub. Remove the "Find
# laravel-security-alerts" steps once they are.

jobs:
  quality:
    name: Code style and static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, mbstring, intl
          coverage: none

      - name: Find laravel-security-alerts
        run: |
          composer config repositories.lsa vcs https://github.com/Ruvelo/laravel-security-alerts
          composer config repositories.sa vcs https://github.com/Ruvelo/security-advisories

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Code style
        run: vendor/bin/pint --test

      - name: Static analysis
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
        laravel: ['12.*', '13.*']
        filament: ['4.*', '5.*']
        stability: [prefer-lowest, prefer-stable]
        include:
          - laravel: '12.*'
            testbench: '10.*'
          - laravel: '13.*'
            testbench: '11.*'

    name: PHP ${{ matrix.php }} · Laravel ${{ matrix.laravel }} · Filament ${{ matrix.filament }} · ${{ matrix.stability }}

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, mbstring, intl
          coverage: none

      - name: Find laravel-security-alerts
        run: |
          composer config repositories.lsa vcs https://github.com/Ruvelo/laravel-security-alerts
          composer config repositories.sa vcs https://github.com/Ruvelo/security-advisories

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "filament/filament:${{ matrix.filament }}" --no-interaction --no-update
          composer require --dev "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: vendor/bin/phpunit
